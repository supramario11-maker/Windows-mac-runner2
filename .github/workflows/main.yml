name: Repository Bootstrap and Docker Test

on:
workflow_dispatch:
push:
paths:
- ".github/workflows/docker-test.yml"
- "orchestration/**"
- "backend/**"
- "frontend/**"

permissions:
contents: write

jobs:
bootstrap:
runs-on: ubuntu-latest
timeout-minutes: 20

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate missing project files
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p orchestration backend frontend config scripts
      mkdir -p platforms/linux platforms/windows platforms/ios

      create_file() {
        local path="$1"
        if [ ! -f "$path" ]; then
          mkdir -p "$(dirname "$path")"
          cat > "$path"
          echo "Created: $path"
        else
          echo "Preserved: $path"
          cat > /dev/null
        fi
      }

      create_file README.md <<'EOF'
      # Cross-Platform Runner

      Starter portal and orchestration scaffolding for Linux, Windows,
      and iOS integration.

      Start the web service with:
      docker compose -f orchestration/docker-compose.yml up --build

      Local URL: http://localhost:8000

      This starter does not yet implement secure arbitrary binary execution.
      EOF

      create_file .gitignore <<'EOF'
      .env
      __pycache__/
      *.pyc
      .venv/
      node_modules/
      dist/
      EOF

      create_file backend/__init__.py <<'EOF'
      """Backend package."""
      EOF

      create_file backend/requirements.txt <<'EOF'
      fastapi>=0.115,<1.0
      uvicorn[standard]>=0.30,<1.0
      EOF

      create_file backend/main.py <<'EOF'
      from pathlib import Path
      from fastapi import FastAPI
      from fastapi.responses import FileResponse
      from fastapi.staticfiles import StaticFiles

      app = FastAPI(title="Cross-Platform Runner")
      frontend = Path(__file__).resolve().parent.parent / "frontend"

      @app.get("/api/health")
      def health():
          return {"status": "ok"}

      @app.get("/api/platforms")
      def platforms():
          return {
              "platforms": [
                  {"name": "Linux", "status": "scaffold"},
                  {"name": "Windows", "status": "scaffold"},
                  {"name": "iOS", "status": "scaffold"}
              ]
          }

      @app.get("/")
      def home():
          return FileResponse(frontend / "index.html")

      app.mount(
          "/static",
          StaticFiles(directory=frontend),
          name="static"
      )
      EOF

      create_file frontend/index.html <<'EOF'
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cross-Platform Runner</title>
        <link rel="stylesheet" href="/static/style.css">
      </head>
      <body>
        <main>
          <h1>Cross-Platform Runner</h1>
          <p>Repository bootstrap is complete.</p>
          <h2>Service status</h2>
          <pre id="status">Loading...</pre>
          <h2>Platforms</h2>
          <pre id="platforms">Loading...</pre>
        </main>
        <script src="/static/app.js"></script>
      </body>
      </html>
      EOF

      create_file frontend/style.css <<'EOF'
      body {
        max-width: 850px;
        margin: 50px auto;
        padding: 20px;
        background: #111827;
        color: #f9fafb;
        font: 16px system-ui, sans-serif;
      }
      main {
        padding: 24px;
        border: 1px solid #374151;
        border-radius: 14px;
      }
      pre {
        padding: 14px;
        background: #1f2937;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      EOF

      create_file frontend/app.js <<'EOF'
      async function load() {
        for (const [endpoint, element] of [
          ["/api/health", "status"],
          ["/api/platforms", "platforms"]
        ]) {
          const target = document.getElementById(element);
          try {
            const response = await fetch(endpoint);
            if (!response.ok) throw new Error("Request failed");
            target.textContent = JSON.stringify(
              await response.json(), null, 2
            );
          } catch (error) {
            target.textContent = "Service unavailable";
          }
        }
      }
      load();
      EOF

      create_file config/app.json <<'EOF'
      {
        "name": "Cross-Platform Runner",
        "version": "0.1.0",
        "execution_enabled_by_default": false
      }
      EOF

      create_file platforms/linux/README.md <<'EOF'
      Linux worker integration scaffold. Add isolated worker implementation.
      EOF

      create_file platforms/windows/README.md <<'EOF'
      Windows worker integration scaffold. Native Windows execution requires
      a Windows host or compatible worker.
      EOF

      create_file platforms/ios/README.md <<'EOF'
      iOS integration scaffold. IPA deployment requires compatible Apple
      signing and device or simulator infrastructure.
      EOF

      create_file scripts/validate.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail
      docker compose -f orchestration/docker-compose.yml config --quiet
      python -m compileall -q backend
      echo "Validation passed."
      EOF

      create_file orchestration/Dockerfile <<'EOF'
      FROM python:3.12-slim
      WORKDIR /app
      ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
      COPY backend/requirements.txt /app/requirements.txt
      RUN pip install --no-cache-dir -r requirements.txt
      COPY backend/ /app/backend/
      COPY frontend/ /app/frontend/
      EXPOSE 8000
      CMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
      EOF

      create_file orchestration/docker-compose.yml <<'EOF'
      services:
        web:
          build:
            context: ..
            dockerfile: orchestration/Dockerfile
          ports:
            - "127.0.0.1:8000:8000"
          restart: unless-stopped
          init: true
          security_opt:
            - no-new-privileges:true
      EOF

      create_file orchestration/supervisord.conf <<'EOF'
      [supervisord]
      nodaemon=true
      logfile=/dev/null
      pidfile=/tmp/supervisord.pid
      EOF

      chmod +x scripts/validate.sh

  - name: Commit and push generated files
    shell: bash
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "No new files to commit."
      else
        git commit -m "chore: generate missing project files"
        git push origin "HEAD:${GITHUB_REF_NAME}"
      fi

  - name: Validate and build
    run: |
      bash scripts/validate.sh
      docker compose -f orchestration/docker-compose.yml build

  - name: Start application
    run: docker compose -f orchestration/docker-compose.yml up -d

  - name: Test application
    shell: bash
    run: |
      set -euo pipefail

      for attempt in $(seq 1 30); do
        if curl --fail --silent \
          http://127.0.0.1:8000/api/health; then
          echo
          break
        fi

        if [ "$attempt" -eq 30 ]; then
          echo "::error::Application failed to start"
          exit 1
        fi

        sleep 2
      done

      curl --fail --silent http://127.0.0.1:8000/ > /dev/null
      curl --fail --silent http://127.0.0.1:8000/api/platforms

  - name: Print logs
    if: always()
    run: |
      docker compose -f orchestration/docker-compose.yml logs --no-color || true

  - name: Stop containers
    if: always()
    run: |
      docker compose -f orchestration/docker-compose.yml down --remove-orphans || true
