name: Repository Bootstrap and Docker Test

on:
workflow_dispatch:
push:
paths:
- ".github/workflows/main.yml"
- "orchestration/**"
- "backend/**"
- "frontend/**"
- "config/**"
- "scripts/**"
- "platforms/**"

permissions:
contents: write

jobs:
bootstrap:
if: github.actor != 'github-actions[bot]'
runs-on: ubuntu-latest
timeout-minutes: 20

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Create missing project files
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p \
        orchestration backend frontend config scripts \
        platforms/linux platforms/windows platforms/ios

      create_file() {
        local path="$1"
        mkdir -p "$(dirname "$path")"

        if [ -e "$path" ]; then
          echo "Preserving existing file: $path"
          cat > /dev/null
        else
          cat > "$path"
          echo "Created: $path"
        fi
      }

      create_file README.md <<'EOF'
      # Cross-Platform Runner

      A starter web portal and orchestration project.

      ## Start

      Install Docker and Docker Compose, then run:

          docker compose -f orchestration/docker-compose.yml up --build

      Open http://localhost:8000

      ## Components

      - backend: Python API
      - frontend: browser dashboard
      - orchestration: Docker configuration
      - platforms: OS integration scaffolds
      - config: application configuration
      - scripts: validation utilities

      This scaffold does not execute arbitrary binaries.
      Production execution requires authentication, isolated workers,
      resource limits, and platform-specific infrastructure.
      EOF

      create_file .gitignore <<'EOF'
      .env
      .venv/
      venv/
      __pycache__/
      *.py[cod]
      .pytest_cache/
      node_modules/
      dist/
      build/
      *.log
      .DS_Store
      EOF

      create_file .dockerignore <<'EOF'
      .git
      .github
      .venv
      __pycache__
      *.pyc
      .env
      node_modules
      dist
      build
      EOF

      create_file .env.example <<'EOF'
      APP_NAME=Cross-Platform Runner
      APP_ENV=development
      PORT=8000
      EOF

      create_file backend/__init__.py <<'EOF'
      """Backend application package."""
      EOF

      create_file backend/requirements.txt <<'EOF'
      fastapi>=0.115,<1.0
      uvicorn[standard]>=0.30,<1.0
      EOF

      create_file backend/main.py <<'EOF'
      from pathlib import Path

      from fastapi import FastAPI
      from fastapi.responses import FileResponse
      from fastapi.staticfiles import StaticFiles

      app = FastAPI(title="Cross-Platform Runner", version="0.1.0")

      FRONTEND = (
          Path(__file__).resolve().parent.parent / "frontend"
      )

      @app.get("/api/health")
      def health():
          return {"status": "ok", "service": "cross-platform-runner"}

      @app.get("/api/platforms")
      def platforms():
          return {
              "platforms": [
                  {"name": "Linux", "status": "scaffold"},
                  {"name": "Windows", "status": "scaffold"},
                  {"name": "iOS", "status": "scaffold"},
              ]
          }

      @app.get("/")
      def home():
          return FileResponse(FRONTEND / "index.html")

      app.mount(
          "/static",
          StaticFiles(directory=FRONTEND),
          name="static",
      )
      EOF

      create_file frontend/index.html <<'EOF'
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cross-Platform Runner</title>
        <link rel="stylesheet" href="/static/style.css">
      </head>
      <body>
        <main class="container">
          <h1>Cross-Platform Runner</h1>
          <p>Application dashboard</p>

          <section>
            <h2>API Health</h2>
            <pre id="health">Checking...</pre>
          </section>

          <section>
            <h2>Platform Integrations</h2>
            <pre id="platforms">Loading...</pre>
          </section>

          <button id="refresh">Refresh</button>
        </main>
        <script src="/static/app.js"></script>
      </body>
      </html>
      EOF

      create_file frontend/style.css <<'EOF'
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10131b;
        color: #edf1ff;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      .container {
        max-width: 850px;
        margin: 50px auto;
      }

      section {
        margin: 20px 0;
        padding: 20px;
        background: #1a2030;
        border: 1px solid #343d55;
        border-radius: 14px;
      }

      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      button {
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      EOF

      create_file frontend/app.js <<'EOF'
      async function loadDashboard() {
        const health = document.getElementById("health");
        const platforms = document.getElementById("platforms");

        try {
          const response = await fetch("/api/health");
          if (!response.ok) throw new Error("Health check failed");

          health.textContent = JSON.stringify(
            await response.json(), null, 2
          );

          const platformResponse = await fetch("/api/platforms");
          if (!platformResponse.ok) {
            throw new Error("Platform request failed");
          }

          platforms.textContent = JSON.stringify(
            await platformResponse.json(), null, 2
          );
        } catch (error) {
          health.textContent = "API unavailable";
          platforms.textContent = "Could not load platform information";
          console.error(error);
        }
      }

      document.getElementById("refresh").addEventListener(
        "click", loadDashboard
      );

      loadDashboard();
      EOF

      create_file config/app.json <<'EOF'
      {
        "name": "Cross-Platform Runner",
        "version": "0.1.0",
        "execution_enabled_by_default": false,
        "platforms": ["linux", "windows", "ios"]
      }
      EOF

      create_file platforms/linux/README.md <<'EOF'
      # Linux Worker

      Integration scaffold. A production worker should run jobs in
      isolated containers with CPU, memory, time, and filesystem limits.
      EOF

      create_file platforms/windows/README.md <<'EOF'
      # Windows Worker

      Integration scaffold. Native Windows binaries require a Windows
      worker or another explicitly supported compatible environment.
      EOF

      create_file platforms/ios/README.md <<'EOF'
      # iOS Integration

      Integration scaffold. IPA deployment requires compatible Apple
      signing, device, or simulator infrastructure.
      EOF

      create_file scripts/validate.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail

      docker compose \
        -f orchestration/docker-compose.yml config --quiet

      python -m compileall -q backend

      echo "Validation passed."
      EOF

      create_file scripts/list-files.sh <<'EOF'
      #!/usr/bin/env bash
      set -euo pipefail

      find . \
        -path './.git' -prune -o \
        -type f -print | sort
      EOF

      create_file orchestration/Dockerfile <<'EOF'
      FROM python:3.12-slim

      ENV PYTHONDONTWRITEBYTECODE=1 \
          PYTHONUNBUFFERED=1

      WORKDIR /app

      COPY backend/requirements.txt /app/requirements.txt

      RUN pip install --no-cache-dir -r requirements.txt

      COPY backend/ /app/backend/
      COPY frontend/ /app/frontend/

      EXPOSE 8000

      CMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
      EOF

      create_file orchestration/docker-compose.yml <<'EOF'
      services:
        web:
          build:
            context: ..
            dockerfile: orchestration/Dockerfile
          ports:
            - "127.0.0.1:8000:8000"
          restart: unless-stopped
          init: true
          security_opt:
            - no-new-privileges:true
      EOF

      create_file orchestration/supervisord.conf <<'EOF'
      [supervisord]
      nodaemon=true
      logfile=/dev/null
      pidfile=/tmp/supervisord.pid
      EOF

      chmod +x scripts/*.sh

      echo "All missing starter files have been generated."
      echo "Existing files have been preserved."

  - name: Commit and push generated files
    shell: bash
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "No generated changes to commit."
      else
        git commit -m "chore: generate missing project files"
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "Generated files pushed to GitHub."
      fi

  - name: Validate project
    run: bash scripts/validate.sh

  - name: Build Docker application
    run: docker compose -f orchestration/docker-compose.yml build

  - name: Start Docker application
    run: docker compose -f orchestration/docker-compose.yml up -d

  - name: Test API and web dashboard
    shell: bash
    run: |
      set -euo pipefail

      ready=false

      for attempt in $(seq 1 30); do
        if curl --fail --silent \
          http://127.0.0.1:8000/api/health \
          -o /tmp/health.json; then
          ready=true
          break
        fi

        sleep 2
      done

      if [ "$ready" != true ]; then
        echo "::error::API did not become ready."
        exit 1
      fi

      cat /tmp/health.json
      echo

      curl --fail --silent \
        http://127.0.0.1:8000/ > /dev/null

      curl --fail --silent \
        http://127.0.0.1:8000/api/platforms

      echo
      echo "API and dashboard tests passed."

  - name: Print diagnostic logs
    if: always()
    run: |
      docker compose \
        -f orchestration/docker-compose.yml logs --no-color || true

  - name: Stop test containers
    if: always()
    run: |
      docker compose \
        -f orchestration/docker-compose.yml down --remove-orphans || true
```
