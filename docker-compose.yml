services:
  linux-desktop:
    build:
      context: ./linux-desktop
    container_name: execution-hub-linux
    init: true
    environment:
      DISPLAY: ":1"
      VNC_PASSWORD: "${VNC_PASSWORD:?Set VNC_PASSWORD in orchestration/.env}"
      RESOLUTION: "${DESKTOP_RESOLUTION:-1440x900}"
    volumes:
      - app-data:/workspace
    shm_size: "1gb"
    restart: unless-stopped
    networks: [desktop-net]
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/.X11-unix/X1 && pgrep -x x11vnc >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No host port published: VNC is only reachable on the private Compose network.

  websockify:
    image: ghcr.io/novnc/websockify:latest
    container_name: execution-hub-websockify
    command: ["--web", "/usr/share/novnc", "6080", "linux-desktop:5900"]
    depends_on:
      linux-desktop:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEBSOCKIFY_PORT:-6080}:6080"
    restart: unless-stopped
    networks: [desktop-net]

networks:
  desktop-net:
    driver: bridge

volumes:
  app-data:
